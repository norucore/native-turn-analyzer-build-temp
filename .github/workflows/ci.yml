# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is automatically triggered for every push and pull request, to verify that everything still builds.

name: Continuous Integration
on:
  workflow_call:
  push:
    paths-ignore:
      - "dist/**"
  pull_request:
  merge_group:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }, target-type: template_debug, float-precision: single }
          - { target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }, target-type: template_release, float-precision: single }
          - { target: { platform: windows, arch: x86_64, os: windows-latest }, target-type: template_debug, float-precision: single }
          - { target: { platform: windows, arch: x86_64, os: windows-latest }, target-type: template_release, float-precision: single }
          - { target: { platform: macos, arch: arm64, os: macos-latest }, target-type: template_debug, float-precision: single }
          - { target: { platform: macos, arch: arm64, os: macos-latest }, target-type: template_release, float-precision: single }

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Lint
      #- name: Setup clang-format
      #  shell: bash
      #  run: |
      #    python -m pip install clang-format
      #- name: Run clang-format
      #  shell: bash
      #  run: |
      #    clang-format src/** --dry-run --Werror

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      # A successful native build does not prove that Godot can load the
      # library or that the Analyzer contracts behave correctly. Debug jobs
      # on the two x86-64 release platforms therefore run the real Godot 4.6
      # runtime against the permanent regression suites.
      - name: Download Godot 4.6.3 (Linux)
        if: ${{ matrix.target.platform == 'linux' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          mkdir -p .ci/godot
          curl --location --fail --retry 3 \
            --output .ci/godot/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q .ci/godot/godot.zip -d .ci/godot
          chmod +x .ci/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Run native Analyzer runtime tests (Linux)
        if: ${{ matrix.target.platform == 'linux' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          GODOT=.ci/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path project --script res://native_semantic_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_compositional_construction_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_corpus_contract_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_corpus_replay.gd
          "$GODOT" --headless --path project --script res://tests/native_user_log_replay.gd
          "$GODOT" --headless --path project --script res://tests/native_fuzz_property_tests.gd

      - name: Install Godot 4.6.3 export templates (Linux)
        if: ${{ matrix.target.platform == 'linux' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 \
            --output .ci/godot/export_templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p .ci/godot/export_templates
          unzip -q .ci/godot/export_templates.tpz -d .ci/godot/export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a .ci/godot/export_templates/templates/. "$TEMPLATE_DIR/"

      - name: Export and run native Analyzer smoke (Linux)
        if: ${{ matrix.target.platform == 'linux' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.ci/godot/Godot_v4.6.3-stable_linux.x86_64
          OUTPUT="$PWD/project/build/linux/native_turn_analyzer_smoke.x86_64"
          mkdir -p "$(dirname "$OUTPUT")"
          "$GODOT" --headless --path project --export-debug "Linux x86-64 Smoke" "$OUTPUT"
          chmod +x "$OUTPUT"
          "$OUTPUT" --headless 2>&1 | tee .ci/linux_export_smoke.log
          grep -F "NTA_EXPORT_RUNTIME_OK" .ci/linux_export_smoke.log

      - name: Download Godot 4.6.3 (Windows)
        if: ${{ matrix.target.platform == 'windows' && matrix.target-type == 'template_debug' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci/godot | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip" `
            -OutFile .ci/godot/godot.zip
          Expand-Archive -Path .ci/godot/godot.zip -DestinationPath .ci/godot -Force

      - name: Run native Analyzer runtime tests (Windows)
        if: ${{ matrix.target.platform == 'windows' && matrix.target-type == 'template_debug' }}
        shell: pwsh
        run: |
          $godot = Resolve-Path ".ci/godot/Godot_v4.6.3-stable_win64_console.exe"
          & $godot --headless --path project --script res://native_semantic_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path project --script res://tests/native_compositional_construction_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path project --script res://tests/native_corpus_contract_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path project --script res://tests/native_corpus_replay.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path project --script res://tests/native_user_log_replay.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Godot 4.6.3 export templates (Windows)
        if: ${{ matrix.target.platform == 'windows' && matrix.target-type == 'template_debug' }}
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" `
            -OutFile .ci/godot/export_templates.zip
          Expand-Archive -Path .ci/godot/export_templates.zip -DestinationPath .ci/godot/export_templates -Force
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\4.6.3.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item -Path ".ci/godot/export_templates/templates/*" -Destination $templateDir -Recurse -Force

      - name: Export and run native Analyzer smoke (Windows)
        if: ${{ matrix.target.platform == 'windows' && matrix.target-type == 'template_debug' }}
        shell: pwsh
        run: |
          $godot = Resolve-Path ".ci/godot/Godot_v4.6.3-stable_win64_console.exe"
          $output = Join-Path $PWD "project/build/windows/native_turn_analyzer_smoke.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $output) | Out-Null
          & $godot --headless --path project --export-debug "Windows x86-64 Smoke" $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeOutput = & $output --headless 2>&1 | Out-String
          $smokeExitCode = $LASTEXITCODE
          Write-Host $smokeOutput
          if ($smokeExitCode -ne 0) { exit $smokeExitCode }
          if (-not $smokeOutput.Contains("NTA_EXPORT_RUNTIME_OK")) {
            Write-Error "Exported Windows smoke did not load NativeTurnAnalyzer"
            exit 1
          }

      # Dal 2026-09-14 anche macOS carica davvero la libreria in CI (tracker
      # Analizzatore #53): prima si compilava e basta, e il Mac e' la macchina
      # dell'utente.
      - name: Download Godot 4.6.3 (macOS)
        if: ${{ matrix.target.platform == 'macos' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          mkdir -p .ci/godot
          curl --location --fail --retry 3 \
            --output .ci/godot/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_macos.universal.zip
          unzip -q .ci/godot/godot.zip -d .ci/godot

      - name: Run native Analyzer runtime tests (macOS)
        if: ${{ matrix.target.platform == 'macos' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: |
          set -euo pipefail
          GODOT=.ci/godot/Godot.app/Contents/MacOS/Godot
          # I test del plugin caricano la libreria da project/bin: la si mette li'.
          cp bin/macos/*native_turn_analyzer* project/bin/macos/
          "$GODOT" --headless --path project --script res://native_semantic_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_compositional_construction_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_corpus_contract_tests.gd
          "$GODOT" --headless --path project --script res://tests/native_corpus_replay.gd
          "$GODOT" --headless --path project --script res://tests/native_user_log_replay.gd

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-turn-analyzer-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          if-no-files-found: error
          path: |
            bin/${{ matrix.target.platform }}/*native_turn_analyzer*
            project/bin/native_turn_analyzer.gdextension
